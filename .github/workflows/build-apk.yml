name: Build Offline APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Native Offline WebView APK with aapt2 + d8 + apksigner
        run: |
          set -e
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)
          ANDROID_JAR="$PLATFORM/android.jar"
          echo "Using BUILD_TOOLS=$BUILD_TOOLS"
          echo "Using ANDROID_JAR=$ANDROID_JAR"

          mkdir -p build/src/com/southwind/gudangpro
          mkdir -p build/res/drawable
          mkdir -p build/assets/vendor/coco
          mkdir -p build/obj

          cp index.html build/assets/index.html
          cp camcount.js build/assets/camcount.js
          cp icon.svg build/assets/icon.svg
          cp icon-192.png build/assets/icon-192.png
          cp icon-512.png build/assets/icon-512.png
          cp manifest.json build/assets/manifest.json
          cp vendor/chart.umd.js build/assets/vendor/chart.umd.js
          cp vendor/xlsx.full.min.js build/assets/vendor/xlsx.full.min.js
          echo "Bundling TensorFlow.js & COCO-SSD offline AI model into APK assets..."
          curl -sL "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js" -o build/assets/vendor/tf.min.js
          curl -sL "https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js" -o build/assets/vendor/coco-ssd.min.js
          for f in model.json group1-shard1of5 group1-shard2of5 group1-shard3of5 group1-shard4of5 group1-shard5of5; do
            curl -sL "https://storage.googleapis.com/tfjs-models/savedmodel/ssdlite_mobilenet_v2/$f" -o "build/assets/vendor/coco/$f"
          done
          cp icon-192.png build/res/drawable/ic_launcher.png

          cat << 'EOF' > build/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.southwind.gudangpro"
              android:versionCode="46"
              android:versionName="4.6.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <application
                  android:label="GudangPro Offline"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > build/src/com/southwind/gudangpro/MainActivity.java
          package com.southwind.gudangpro;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.DialogInterface;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.JsResult;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
              private static final int FILE_CHOOSER_RESULT_CODE = 1001;
              private static final int CAMERA_PERMISSION_CODE = 1002;
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private PermissionRequest pendingWebPermission;

              private void saveBytesToDownloads(final String fileName, final byte[] bytes, final String mimeType) {
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.MediaColumns.DISPLAY_NAME, fileName);
                          values.put(MediaStore.MediaColumns.MIME_TYPE, mimeType);
                          values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          ContentResolver resolver = getContentResolver();
                          Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri != null) {
                              OutputStream os = resolver.openOutputStream(uri);
                              if (os != null) {
                                  os.write(bytes);
                                  os.flush();
                                  os.close();
                                  runOnUiThread(new Runnable() {
                                      public void run() {
                                          Toast.makeText(MainActivity.this, "Tersimpan di Download HP: " + fileName, Toast.LENGTH_LONG).show();
                                      }
                                  });
                                  return;
                              }
                          }
                      }
                      File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (!dir.exists()) dir.mkdirs();
                      File out = new File(dir, fileName);
                      FileOutputStream fos = new FileOutputStream(out);
                      fos.write(bytes);
                      fos.flush();
                      fos.close();
                      runOnUiThread(new Runnable() {
                          public void run() {
                              Toast.makeText(MainActivity.this, "Tersimpan di Download HP: " + fileName, Toast.LENGTH_LONG).show();
                          }
                      });
                  } catch (Exception e) {
                      final String msg = e.getMessage();
                      runOnUiThread(new Runnable() {
                          public void run() {
                              Toast.makeText(MainActivity.this, "Gagal simpan: " + msg, Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                                      pendingWebPermission = request;
                                      requestPermissions(new String[]{ Manifest.permission.CAMERA }, CAMERA_PERMISSION_CODE);
                                  } else {
                                      request.grant(request.getResources());
                                  }
                              }
                          });
                      }

                      @Override
                      public boolean onJsAlert(WebView view, String url, String message, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setTitle("GudangPro")
                              .setMessage(message)
                              .setPositiveButton("OK", new DialogInterface.OnClickListener() {
                                  public void onClick(DialogInterface dialog, int which) {
                                      result.confirm();
                                  }
                              })
                              .setOnCancelListener(new DialogInterface.OnCancelListener() {
                                  public void onCancel(DialogInterface dialog) {
                                      result.cancel();
                                  }
                              })
                              .show();
                          return true;
                      }

                      @Override
                      public boolean onJsConfirm(WebView view, String url, String message, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setTitle("Konfirmasi GudangPro")
                              .setMessage(message)
                              .setPositiveButton("Ya / Lanjutkan", new DialogInterface.OnClickListener() {
                                  public void onClick(DialogInterface dialog, int which) {
                                      result.confirm();
                                  }
                              })
                              .setNegativeButton("Batal", new DialogInterface.OnClickListener() {
                                  public void onClick(DialogInterface dialog, int which) {
                                      result.cancel();
                                  }
                              })
                              .setOnCancelListener(new DialogInterface.OnCancelListener() {
                                  public void onCancel(DialogInterface dialog) {
                                      result.cancel();
                                  }
                              })
                              .show();
                          return true;
                      }

                      @Override
                      public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }
                          filePathCallback = callback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          try {
                              startActivityForResult(Intent.createChooser(intent, "Pilih File Sync (.gpsync.json) / Video / Foto"), FILE_CHOOSER_RESULT_CODE);
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void saveTextFile(final String fileName, final String content) {
                          byte[] bytes = content.getBytes(StandardCharsets.UTF_8);
                          saveBytesToDownloads(fileName, bytes, "application/json");
                      }

                      @JavascriptInterface
                      public void saveBase64File(final String fileName, final String base64Data, final String mimeType) {
                          byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                          saveBytesToDownloads(fileName, bytes, mimeType != null && !mimeType.isEmpty() ? mimeType : "application/octet-stream");
                      }

                      @JavascriptInterface
                      public void printPage() {
                          runOnUiThread(new Runnable() {
                              public void run() {
                                  try {
                                      PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                      PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter("GudangPro_Document");
                                      pm.print("GudangPro_Document", adapter, new PrintAttributes.Builder().build());
                                  } catch (Exception e) {
                                      Toast.makeText(MainActivity.this, "Gagal membuka cetak: " + e.getMessage(), Toast.LENGTH_LONG).show();
                                  }
                              }
                          });
                      }

                      @JavascriptInterface
                      public String readAssetBase64(final String assetPath) {
                          try {
                              InputStream is = getAssets().open(assetPath);
                              ByteArrayOutputStream baos = new ByteArrayOutputStream();
                              byte[] buf = new byte[16384];
                              int n;
                              while ((n = is.read(buf)) != -1) {
                                  baos.write(buf, 0, n);
                              }
                              is.close();
                              return Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                          } catch (Exception e) {
                              return "";
                          }
                      }
                  }, "AndroidBridge");

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  if (requestCode == CAMERA_PERMISSION_CODE) {
                      if (pendingWebPermission != null) {
                          if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                              pendingWebPermission.grant(pendingWebPermission.getResources());
                          } else {
                              pendingWebPermission.deny();
                          }
                          pendingWebPermission = null;
                      }
                  } else {
                      super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_RESULT_CODE) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          String dataString = data.getDataString();
                          if (dataString != null) {
                              results = new Uri[]{ Uri.parse(dataString) };
                          }
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  } else {
                      super.onActivityResult(requestCode, resultCode, data);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          $BUILD_TOOLS/aapt2 compile --dir build/res -o build/res.zip
          $BUILD_TOOLS/aapt2 link -o build/unsigned.apk \
            -I "$ANDROID_JAR" \
            --manifest build/AndroidManifest.xml \
            --java build/src \
            -A build/assets \
            build/res.zip

          javac -source 1.8 -target 1.8 -bootclasspath "$ANDROID_JAR" -classpath "$ANDROID_JAR" -d build/obj \
            build/src/com/southwind/gudangpro/R.java \
            build/src/com/southwind/gudangpro/MainActivity.java

          $BUILD_TOOLS/d8 --lib "$ANDROID_JAR" --output build/ build/obj/com/southwind/gudangpro/*.class

          cd build
          zip -uj unsigned.apk classes.dex
          cd ..

          $BUILD_TOOLS/zipalign -f -p 4 build/unsigned.apk build/aligned.apk

          keytool -genkeypair -v -keystore build/release.keystore -alias gudangpro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password123 -keypass password123 \
            -dname "CN=GudangPro ERP, OU=Warehouse, O=Southwind Plantation, L=Jakarta, S=DKI, C=ID"

          $BUILD_TOOLS/apksigner sign \
            --ks build/release.keystore \
            --ks-pass pass:password123 \
            --key-pass pass:password123 \
            --out GudangPro-Offline.apk \
            build/aligned.apk

          cp GudangPro-Offline.apk GudangPro.apk
          ls -lh GudangPro-Offline.apk GudangPro.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add GudangPro.apk
          git commit -m "chore: update compiled GudangPro.apk [skip ci]" || true
          git push origin main || true

      - uses: actions/upload-artifact@v4
        with:
          name: GudangPro-Offline-APK
          path: GudangPro-Offline.apk
